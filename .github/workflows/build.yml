name: Build Kitchen Inventory

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            file: "Kitchen Inventory.exe"

          - os: ubuntu-latest
            name: linux
            file: "Kitchen Inventory"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: |
          flet pack app.py -n "Kitchen Inventory"
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "dist/${{ matrix.file }}"

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --module-name app.py --arch arm64-v8a --yes --verbose
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/apk/*.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            release/"Kitchen Inventory.exe" \
            release/"Kitchen Inventory" \
            release/*.apk \
            --title "Kitchen Inventory ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}